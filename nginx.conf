server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # fichiers Vite (nom haché) : cache longue durée
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html : toujours revalidé, pour que les mises à jour passent
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # le scan de la galerie fait beaucoup de 404 : on évite de polluer les logs
  location /gallery/ {
    access_log off;
    log_not_found off;
  }
}
