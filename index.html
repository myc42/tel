<html lang="fr">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style type="text/tailwindcss">
  @layer components {
    .row { @apply flex w-full items-center gap-3 px-4 py-2.5 text-left; }
    .grp { @apply mx-4 mb-6 overflow-hidden rounded-xl bg-[#1c1c1e]; }
    .big { @apply px-4 pb-2 pt-1 text-[34px] font-bold leading-tight; }
    .sub { @apply text-[13px] text-white/50; }
    .ic { @apply relative flex h-[60px] w-[60px] shrink-0 items-center justify-center overflow-hidden; border-radius: 22.37%; }

  }
</style>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; }

  #lock { transition: transform .5s cubic-bezier(.32,.72,0,1); }
  #lock.drag { transition: none; }
  @keyframes up{0%{transform:translateY(10px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pop{from{transform:scale(.6) translateY(18px);opacity:0}}
  @keyframes ring{from{transform:scale(1);opacity:.45}to{transform:scale(2.3);opacity:0}}
  @keyframes eq{50%{transform:scaleY(.25)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chev{animation:up 1.8s ease-in-out infinite}
  .shim{background:linear-gradient(90deg,rgba(255,255,255,.4) 35%,#fff 50%,rgba(255,255,255,.4) 65%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.6s linear infinite}

  #phone[data-call] #bar{pointer-events:none}
  .ov{transition:opacity .4s,transform .45s cubic-bezier(.32,.72,0,1)}
  .ov.off{opacity:0;pointer-events:none;transform:scale(1.04)}
  #banner{transform:translateY(-175%);pointer-events:none;transition:transform .55s cubic-bezier(.32,.72,0,1)}
  #banner.show{transform:none;pointer-events:auto}
  @keyframes al{from{transform:scale(1.15);opacity:0}}
  #batt:not(.off)>div{animation:al .3s ease-out}

  #clock, #cT, #num { font-variant-numeric: tabular-nums; }
  #grid > button:not(.col-span-2) { font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</head>

    </section>

    <div id="batt" class="ov off absolute inset-0 z-[80] flex items-center justify-center bg-black/45" role="alertdialog" aria-labelledby="bT">

        <div class="divide-y divide-white/15 border-t border-white/15 text-[17px] text-[#0a84ff]"><button data-b="lp" class="block w-full py-3">Mode économie d’énergie</button><button data-b="ok" class="block w-full py-3 font-semibold">Fermer</button></div></div>
    </div>
    <section id="call" class="ov off absolute inset-0 z-[64] overflow-hidden bg-black text-center text-white" aria-live="polite">
      <div id="cBg" class="absolute inset-0 scale-125 bg-[#2b1b3b] bg-cover bg-center" style="filter:blur(40px) brightness(.5)"></div>

    <button id="bar" class="absolute inset-x-0 bottom-0 z-[66] flex h-[34px] items-end justify-center pb-1.5" aria-label="Accueil"><span class="h-[4px] w-[140px] rounded-full bg-white/90"></span></button>
  </div>
</div>
</div>

<script>
/* ===================== CONTENU ===================== */
const DATA = {
  owner: "Lou",
  battery: 9,
  weather: { city: "Abidjan", temp: 29, cond: "Partiellement nuageux", hi: 31, lo: 25,
    hours: [["⛅", 29], ["⛅", 30], ["☀️", 31], ["⛅", 30], ["🌧️", 27], ["🌙", 26]],

  /* Galerie : remplie automatiquement depuis le dossier gallery/ (voir « GALERIE » en bas du premier script) */

  wa: [
    { name: "Maman", time: "09:41", unread: 2, msgs: [{ t: "Tu es où ??", h: "09:12" }, { me: 1, t: "Au studio, j’arrive", h: "09:14" }, { vo: "0:12", t: "🎤 0:12", h: "09:30" }, { img: { a: "#fda4af", b: "#be123c" }, t: "📷 Photo", h: "09:36", dl: "1,2 Mo" }, { t: "Rappelle-moi 😭", h: "09:41" }] },
    { name: "Groupe du studio", time: "Hier", msgs: [{ t: "Répét demain à 14h", h: "18:02" }, { img: { a: "#67e8f9", b: "#3b82f6" }, t: "📷 Photo", h: "18:03" }, { vo: "0:21", t: "🎤 0:21", h: "18:04" }, { me: 1, t: "Je suis là 👍", h: "18:05" }] },
    { name: "Théo", time: "Lundi", msgs: [{ me: 1, t: "T’as vu la vidéo ?", h: "21:30" }, { vo: "0:07", t: "🎤 0:07", h: "21:31" }, { img: { a: "#fcd34d", b: "#f97316" }, t: "📷 Photo", h: "21:32" }, { t: "Morte de rire 😂", h: "21:33" }] }

/* ============================ FIN DU CONTENU ============================ */

const emit = (n, d) => document.dispatchEvent(new CustomEvent("ph", { detail: { n, d } })), $ = s => document.querySelector(s), D = DATA, P = '<div class="h-10"></div>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ini = n => esc(n.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase());
const bg = p => p.src ? `background:url('${esc(p.src)}') center/cover` : `background:linear-gradient(135deg,${p.a},${p.b})`;
const gr = p => bg({ a: p.a, b: p.b });
const HS = '<path fill="#fff" d="M18 12c-3 1-5 4-4 9 3 12 14 23 27 27 5 1 8-1 9-4l1-3c.4-1-.1-2-1-2.5l-8-3.6c-1-.4-2-.2-2.7.6l-2 2.4c-5-2.4-9.5-7-12-12l2.4-2c.8-.7 1-1.7.6-2.7l-3.6-8C21 12.3 20 12 19 12z"/>';
const CH = '<svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>', PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const now = new Date(), svg = b => `<svg class="h-full w-full" viewBox="0 0 60 60">${b}</svg>`;

/* Icônes d'apps (Images locales dans le dossier "icons") */
const _img = url => `<img src="${url}" class="absolute inset-0 w-full h-full object-cover scale-[1.02]" alt="">`;
const TKP = "M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z";
const IC = {

const APPS = { messages: ["Messages", "#0a84ff"], photos: ["Galerie", "#0a84ff"], notes: ["Notes", "#ffd60a"], contacts: ["Contacts", "#0a84ff"], facetime: ["FaceTime", "#30d158"], calendar: ["Calendrier", "#ff453a"],  camera: ["Appareil photo", "#ffd60a"], youtube: ["YouTube", "#ff3030"], spotify: ["Spotify", "#1ed760"], safari: ["Safari", "#0a84ff"], phone: ["Téléphone", "#0a84ff"], whatsapp: ["WhatsApp", "#25d366"], weather: ["Météo", "#fff"] };

const WV = Array.from({ length: 26 }, (_, k) => `<i class="w-[2.5px] shrink-0 rounded-full" style="height:${5 + (k * 7 % 5) * 4}px;background:rgba(255,255,255,${k < 9 ? .9 : .4})"></i>`).join("");

const wc = n => ["#06cf9c", "#53bdeb", "#ffa726", "#e57373", "#ba68c8"][[...n].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 5];
const wm = (m, i, j) => { if (m.sys) return `<div class="flex justify-center py-1"><span class="rounded-lg bg-[#182229] px-3 py-1 text-center text-[12.5px] text-[#8696a0]">${esc(m.sys)}</span></div>`; const me = m.me, tm = `<span class="text-[11px] text-white/50">${esc(m.h || "")}${me ? ' <span class="text-[#53bdeb]">✓✓</span>' : ""}</span>`;

    : `${m.from ? `<b class="block text-[13px] font-semibold" style="color:${wc(m.from)}">${esc(m.from)}</b>` : ""}${esc(m.t)} <span class="float-right ml-2 mt-2">${tm}</span>`;

const tabs = (items, act, c) => `<div class="glass sticky bottom-0 flex justify-around border-t border-white/10 bg-black/85 pb-9 pt-2 text-[10px]">${items.map(([l, k, i]) => `<button ${k ? `data-tab="${k}"` : ""} class="flex w-16 flex-col items-center gap-0.5" style="color:${l === act ? c : "#8e8e93"}">${i}${l}</button>`).join("")}</div>`;

/* Appareil photo (vraie caméra si autorisée), YouTube */
let cam = null, ytOn = false;
const stopCam = () => { cam?.getTracks().forEach(t => t.stop()); cam = null; };
async function startCam() {
  try {
    const m = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    if (!$("#cam")) return m.getTracks().forEach(t => t.stop());
    cam = m; $("#cam").srcObject = m;
  } catch { const e = $("#camMsg"); if (e) e.textContent = "Autorise l’accès à la caméra pour prendre des photos."; }
}
function shot() {
  const f = $("#flash"), v = $("#cam"); f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 120);
  if (!v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  D.gallery.unshift({ src: c.toDataURL("image/jpeg", .85), date: "Aujourd’hui à " + hm(new Date()) }); $("#thumb").style.cssText = bg(D.gallery[0]);
}
function ytTog() {
  const b = $("#ytBar"); ytOn = !ytOn; $("#ytIc").innerHTML = ytOn ? PAUSE : PLAY;
  const w = getComputedStyle(b).width; b.style.transition = "none"; b.style.width = w;
  if (ytOn) { b.offsetWidth; b.style.transition = "width 120s linear"; b.style.width = "100%"; }
}

/* Navigation (pile de vues) */
let st = [];
function show() {
  const s = st.at(-1), [k, a] = s.k.split(":"), v = V[k](a), pv = st.at(-2);
  s.t = v.t; $("#hTitle").textContent = v.large ? "" : v.t; $("#hdr").hidden = !!v.full;
  $("#back").innerHTML = CH + (pv ? esc(pv.t) : "Accueil"); $("#fback").style.display = v.full ? "flex" : "none"; $("#body").innerHTML = v.h; $("#body").scrollTop = 0;
  if (k !== "camera") stopCam(); v.after?.(); emit("view", k);
}
function openApp(id, el) {
  const p = $("#phone").getBoundingClientRect(), r = el.getBoundingClientRect(), a = $("#app");
  a.style.transformOrigin = `${r.left + r.width / 2 - p.left}px ${r.top + r.height / 2 - p.top}px`;
  a.style.setProperty("--ac", APPS[id][1]); st = [{ k: id, t: "" }]; show(); a.classList.add("open"); emit("open", id);
}
const closeApp = () => { $("#app").classList.remove("open"); st = []; stopCam(); emit("close"); };
const goBack = () => { st.pop(); st.length ? show() : closeApp(); };
function tog(i) {
  if (i !== cur) { au?.pause(); cur = i; play = true; au = D.tracks[i].src ? new Audio(D.tracks[i].src) : null; } else play = !play;
  if (au) play ? au.play().catch(() => {}) : au.pause();
  show();
}
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"), g = e.target.closest("[data-go]"), t = e.target.closest("[data-track]");
  if (o) { if (o.dataset.open === "safari") location.href = D.safariUrl; else openApp(o.dataset.open, o); } else if (g) { st.push({ k: g.dataset.go, t: "" }); show(); }
  else if (t) tog(+t.dataset.track); else if (e.target.closest("[data-shot]")) shot(); else if (e.target.closest("[data-yt]")) ytTog();
  else if (e.target.closest("[data-back],#back,#fback")) goBack();
});

/* Écran verrouillé : balayage vers le haut (ou simple tap) */
const lock = $("#lock"); let y0 = null, locked = true;
const unlock = () => { lock.classList.remove("drag"); lock.style.transform = "translateY(-105%)"; locked = false; emit("unlock"); };
lock.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; y0 = e.clientY; lock.classList.add("drag"); lock.setPointerCapture(e.pointerId); });
lock.addEventListener("pointermove", e => { if (y0 !== null) lock.style.transform = `translateY(${Math.min(0, e.clientY - y0)}px)`; });
lock.addEventListener("pointerup", e => { if (y0 === null) return; const d = e.clientY - y0; y0 = null; lock.classList.remove("drag"); d < -120 || Math.abs(d) < 6 ? unlock() : (lock.style.transform = ""); });
lock.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") unlock(); });
$("#torch").addEventListener("click", e => ["bg-black/40", "bg-white", "text-white", "text-black"].forEach(c => e.currentTarget.classList.toggle(c)));
$("#bar").addEventListener("click", () => { if (locked) unlock(); else closeApp(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-key],[data-del],[data-dial],[data-tab]"); if (!b) return;
  if (b.dataset.key !== undefined) key(b.dataset.key);
  else if (b.hasAttribute("data-del")) key(null);
  else if (b.hasAttribute("data-dial")) { if (numStr) { st.push({ k: "tel:" + numStr, t: "" }); show(); } }
  else { st = [{ k: b.dataset.tab, t: "" }]; show(); }
});

/* ===================== GALERIE =====================
   Scanne le dossier gallery/ : 1.jpg, 2.mp4, 3.png … (numéros croissants, trous tolérés).
   Tu ajoutes un fichier avec le numéro suivant → il apparaît tout seul, rien à modifier ici.
   Ordre d’affichage = numéro du fichier.
   gap = nombre de numéros vides d’affilée avant d’arrêter le scan. */
const GAL = { dir: "gallery", img: ["jpg", "jpeg", "png", "webp"], vid: ["mp4", "mov", "webm"], gap: 15, max: 500, batch: 8 };
const probe = (url, vid) => new Promise(done => {
  setTimeout(() => done(false), 6000);
  if (location.protocol !== "file:")
    return fetch(url, { method: "HEAD" }).then(r => done(r.ok && /^(image|video)\//.test(r.headers.get("content-type") || ""))).catch(() => done(false));
  const e = vid ? document.createElement("video") : new Image(); /* en local (file://) fetch est bloqué : on teste en chargeant le fichier */
  e.onload = e.onloadedmetadata = () => done(true); e.onerror = () => done(false);
  if (vid) e.preload = "metadata"; e.src = url;
});
const GAL_TYPES = [...GAL.img.map(x => [x, 0]), ...GAL.vid.map(x => [x, 1])];
const findNum = async n => (await Promise.all(GAL_TYPES.map(async ([x, vid]) => { const src = `${GAL.dir}/${n}.${x}`; return (await probe(src, vid)) ? { src, vid } : null; }))).filter(Boolean);
async function loadGallery() {
  const out = []; let miss = 0;
  for (let n = 1; n <= GAL.max && miss < GAL.gap; n += GAL.batch)
    for (const r of await Promise.all(Array.from({ length: GAL.batch }, (_, k) => findNum(n + k)))) r.length ? (out.push(...r), miss = 0) : miss++;
  return out;
}

  D.gallery.push(...items.map((p, i) => ({ ...p, date: stamp(i) })));

});
