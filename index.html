<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Tu as trouvé le téléphone de Maabio… Fouille-le.">
<title>Le téléphone de Maabio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
</head>
<body>
<div class="flex min-h-full items-center justify-center">
<div class="relative w-full max-w-[410px]">
  <div id="phone" data-s="lock" class="relative w-full overflow-hidden bg-black text-white sm:rounded-[58px] sm:border-[10px] sm:border-[#1c1c1e] sm:ring-1 sm:ring-white/25 sm:shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]" style="height:100dvh;max-height:864px">

    <!-- Boutons physiques -->
    <div class="hidden sm:block absolute -left-[14px] top-[140px] h-[28px] w-[4px] rounded-l bg-[#2c2c2e]"></div>
    <div class="hidden sm:block absolute -left-[14px] top-[190px] h-[55px] w-[4px] rounded-l bg-[#2c2c2e]"></div>
    <div class="hidden sm:block absolute -left-[14px] top-[260px] h-[55px] w-[4px] rounded-l bg-[#2c2c2e]"></div>
    <div class="hidden sm:block absolute -right-[14px] top-[210px] h-[85px] w-[4px] rounded-r bg-[#2c2c2e]"></div>

    <div id="wall" class="absolute inset-0"></div>

    <!-- Dynamic Island + barre d'état -->
    <div class="absolute left-1/2 top-[11px] z-[70] flex h-[37px] w-[124px] -translate-x-1/2 items-center justify-end rounded-full bg-black pr-3 shadow-[inset_0_0_2px_rgba(255,255,255,0.05)]">
      <div class="h-3 w-3 rounded-full bg-white/10 blur-[0.5px]"></div>
    </div>
    <div class="pointer-events-none absolute inset-x-0 top-0 z-[65] flex h-[54px] items-center justify-between px-7 pt-1.5">
      <span id="clock" class="w-[74px] text-center text-[17px] font-semibold"></span>
      <span class="flex w-[74px] items-center justify-center gap-1.5">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1-1.1A10.4 10.4 0 0 0 8.5.8 10.4 10.4 0 0 0 1.5 3.6l1 1.1a8.8 8.8 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1-1.1a7.2 7.2 0 0 0-8.8 0l1 1.1a5 5 0 0 1 3.4-1.3zm0 3.5c.6 0 1.1.2 1.5.6L8.5 12 7 10c.4-.4.9-.6 1.5-.6z"/></svg>
        <span id="bat" class="flex"></span>
      </span>
    </div>

    <!-- Écran d'accueil -->
    <div id="home" class="absolute inset-0 z-10 transition-opacity duration-500">
    <main class="absolute inset-0 z-10 px-[27px] pt-[108px]">
      <div id="grid" class="grid auto-rows-[82px] grid-cols-4 gap-x-[22px] gap-y-4"></div>
    </main>
    <div class="glass absolute bottom-[122px] left-1/2 z-10 -translate-x-1/2 rounded-full px-5 py-1 text-[13px] text-white/90">Recherche</div>
    <div id="dock" class="glass absolute inset-x-2.5 bottom-[22px] z-10 flex justify-around rounded-[36px] py-3"></div>
    </div>

    <!-- Application ouverte -->
    <section id="app" class="absolute inset-0 z-20 flex flex-col bg-black">
      <header id="hdr" class="glass z-10 shrink-0 bg-black/70 px-3 pb-1.5 pt-[54px] !border-none !rounded-none">
        <div class="relative flex h-11 items-center">
          <button id="back" class="z-10 flex items-center gap-1 text-[17px]" style="color:var(--ac)"></button>
          <h2 id="hTitle" class="pointer-events-none absolute inset-x-0 text-center text-[17px] font-semibold"></h2>
        </div>
      </header>
      <button id="fback" style="display:none" class="glass absolute left-3 top-[58px] z-30 items-center justify-center rounded-full bg-black/40 pr-0.5 h-9 w-9" aria-label="Retour"><svg width="10" height="17" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="body" class="relative flex-1 overflow-y-auto overscroll-contain"></div>
    </section>

    <!-- Écran verrouillé -->
    <section id="lock" class="absolute inset-0 z-50 flex cursor-pointer flex-col items-center text-center" style="touch-action:none" tabindex="0" aria-label="Écran verrouillé : balaie vers le haut pour ouvrir">
      <svg class="mt-[60px]" width="16" height="22" viewBox="0 0 16 22"><rect y="9" width="16" height="13" rx="3" fill="#fff"/><path d="M3.5 9V6.5a4.5 4.5 0 0 1 9 0V9" fill="none" stroke="#fff" stroke-width="2.4"/></svg>
      <p id="lDate" class="mt-4 text-[19px] font-semibold capitalize text-white/85"></p>
      <p id="lTime" class="text-[105px] font-semibold leading-[1.1] tracking-tighter"></p>
      <p id="lMsg" class="-mt-1 px-8 text-[17px] font-medium text-white/90 drop-shadow"></p>
      <div id="notif" class="glass mx-3 mb-[150px] mt-auto flex w-[calc(100%-24px)] items-start gap-3 rounded-[22px] bg-[#3a3a3e]/60 p-3 text-left"></div>
      <div class="absolute inset-x-0 bottom-[58px] flex justify-between px-11">
        <button id="torch" class="glass flex h-[50px] w-[50px] items-center justify-center rounded-full bg-black/40 text-white" aria-label="Lampe torche"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8v4l-2 3v2h-4V9L8 6zM10 13h4v8a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"/></svg></button>
        <button class="glass flex h-[50px] w-[50px] items-center justify-center rounded-full bg-black/40" aria-label="Appareil photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5z"/><circle cx="12" cy="13" r="3.8" fill="#3a3a3e"/></svg></button>
      </div>
      <div class="pointer-events-none absolute inset-x-0 bottom-[60px] flex flex-col items-center gap-1"><svg class="chev" width="24" height="12" viewBox="0 0 24 12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-8 9 8"/></svg><p class="shim text-[16px] font-medium">Balayer vers le haut</p></div>
    </section>

    <div id="batt" class="ov off absolute inset-0 z-[80] flex items-center justify-center bg-black/45" role="alertdialog" aria-labelledby="bT">
      <div class="glass w-[270px] overflow-hidden rounded-2xl bg-[#2c2c2e]/90 text-center"><p class="px-4 py-5"><b id="bT" class="block text-[17px] font-semibold">Batterie faible</b><span id="bS" class="text-[13px] text-white/70"></span></p>
        <div class="divide-y divide-white/15 border-t border-white/15 text-[17px] text-[#0a84ff]"><button data-b="lp" class="block w-full py-3">Mode économie d’énergie</button><button data-b="ok" class="block w-full py-3 font-semibold">Fermer</button></div></div>
    </div>
    <section id="call" class="ov off absolute inset-0 z-[64] overflow-hidden bg-black text-center text-white" aria-live="polite">
      <div id="cBg" class="absolute inset-0 scale-125 bg-[#2b1b3b] bg-cover bg-center" style="filter:blur(40px) brightness(.5)"></div>
      <div id="cBody" class="absolute inset-0 flex flex-col items-center px-6 pt-[78px]"></div>
    </section>
    <button id="banner" class="glass absolute inset-x-3 top-[54px] z-[72] flex items-start gap-3 rounded-[22px] bg-[#3a3a3e]/70 p-3 text-left" aria-label="Nouveau message"></button>
    <button id="bar" class="absolute inset-x-0 bottom-0 z-[66] flex h-[34px] items-end justify-center pb-1.5" aria-label="Accueil"><span class="h-[4px] w-[140px] rounded-full bg-white/90"></span></button>
  </div>
</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
